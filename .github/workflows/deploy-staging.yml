name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aisyspro-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout deployment script from develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.STAGING_SSH_HOST_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy develop on CloudPanel site
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "${STAGING_PORT:-22}" \
            "$STAGING_USER@$STAGING_HOST" \
            "bash -s -- '$STAGING_PATH'" < scripts/deploy-staging.sh

      - name: Verify staging health
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 https://staging.aisyspro.tn/api/v1/health
